# Render Blueprint for the ProofGate API (backend only; the frontend goes to Vercel).
# No secret VALUES live here: `sync: false` makes Render ask for each one in the dashboard when the
# Blueprint is created; the session secret is generated by Render.
#
# !! PERSISTENCE: as written this is a FREE web service, whose filesystem is EPHEMERAL. The SQLite
# database — USER ACCOUNTS, runs, bookings, orders and logouts — is DELETED on every redeploy, restart
# and idle spin-down. Users would have to sign up again. Fine for a short live demo only.
# For accounts that persist, use the paid option below (see DEPLOYMENT.md, "Persistence").
services:
  - type: web
    name: proofgate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: PROOFGATE_ENV
        value: production            # accounts required; fails closed if the session secret is missing or weak
      - key: PROOFGATE_SESSION_SECRET
        generateValue: true          # random value created by Render, never committed
      - key: PROOFGATE_CLIENT_IP_HEADER
        value: True-Client-IP        # visitor IP set by Render's edge (not spoofable like X-Forwarded-For)
      - key: PROOFGATE_ALLOWED_ORIGINS
        sync: false                  # e.g. https://your-project.vercel.app (no trailing slash)
      - key: SERPAPI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
    # Persistent accounts (PAID — not enabled here): a persistent disk needs a paid instance type.
    # To enable, change `plan: free` to `plan: starter`, uncomment the disk, and add the env var:
    # disk:
    #   name: proofgate-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # - key: PROOFGATE_DB_PATH
    #   value: /var/data/proofgate.db

# Render Blueprint for the ProofGate API (backend only; the frontend goes to Vercel).
# Free web service. No secret VALUES live here: `sync: false` makes Render ask for each one
# in the dashboard when the Blueprint is created; the session secret is generated by Render.
# See DEPLOYMENT.md. NOTE: the free filesystem is ephemeral — SQLite runs/bookings/orders are
# lost on every restart, redeploy or spin-down.
services:
  - type: web
    name: proofgate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: PROOFGATE_ENV
        value: production            # forces sign-in; fails closed if the password/secret are missing or weak
      - key: PROOFGATE_SESSION_SECRET
        generateValue: true          # random value created by Render, never committed
      - key: PROOFGATE_DEMO_PASSWORD
        sync: false                  # you enter it in the dashboard (12+ characters)
      - key: PROOFGATE_CLIENT_IP_HEADER
        value: True-Client-IP        # visitor IP set by Render's edge (not spoofable like X-Forwarded-For)
      - key: PROOFGATE_ALLOWED_ORIGINS
        sync: false                  # e.g. https://your-project.vercel.app (no trailing slash)
      - key: SERPAPI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
